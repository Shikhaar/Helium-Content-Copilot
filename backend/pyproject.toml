[project]
name = "helium-content-copilot"
version = "0.1.0"
description = "AI-powered content opportunity and generation tool for D2C brands"
authors = [
    {name = "Shikhar Srivastava"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.3,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "openai (>=3.2.0,<4.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
