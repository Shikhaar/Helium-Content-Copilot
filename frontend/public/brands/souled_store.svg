<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tssRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED2224" />
      <stop offset="100%" stop-color="#C81014" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#tssRed)" />
  
  <!-- The Souled Store Iconic Ghost/Soul Character Face -->
  <g transform="translate(60, 48)">
    <!-- Soul Body Outline / Shape -->
    <path d="M 0 -25 C 18 -25 28 -14 28 4 C 28 18 20 25 14 25 C 9 25 6 20 0 20 C -6 20 -9 25 -14 25 C -20 25 -28 18 -28 4 C -28 -14 -18 -25 0 -25 Z" fill="#FFFFFF" />
    
    <!-- Big Expressive Black Eyes -->
    <ellipse cx="-9" cy="-3" rx="4.5" ry="6.5" fill="#C81014" />
    <ellipse cx="9" cy="-3" rx="4.5" ry="6.5" fill="#C81014" />
    <!-- Eye Glints -->
    <circle cx="-10.5" cy="-5.5" r="1.8" fill="#FFFFFF" />
    <circle cx="7.5" cy="-5.5" r="1.8" fill="#FFFFFF" />
    
    <!-- Happy Smile -->
    <path d="M -7 9 Q 0 16 7 9" stroke="#C81014" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- TSS Wordmark -->
  <text x="60" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">THE SOULED STORE</text>
  <text x="60" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="8" font-weight="800" letter-spacing="2" fill="rgba(255,255,255,0.85)" text-anchor="middle">OFFICIAL MERCH</text>
</svg>
