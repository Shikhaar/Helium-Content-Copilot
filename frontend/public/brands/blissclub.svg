<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A261B" />
      <stop offset="100%" stop-color="#2D150E" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3" />
      <stop offset="100%" stop-color="#EEDAC8" />
    </linearGradient>
  </defs>
  <!-- Background with subtle luxury rounded corners -->
  <rect width="120" height="120" rx="26" fill="url(#bcGrad)" />
  
  <!-- Blissclub signature dynamic floral/petal motion mark -->
  <g transform="translate(60, 50)">
    <!-- 4 Blissful Petals rotating in freedom -->
    <path d="M 0 -22 C 8 -22 18 -14 18 -4 C 18 6 8 14 0 20 C -8 14 -18 6 -18 -4 C -18 -14 -8 -22 0 -22 Z" fill="url(#petalGrad)" opacity="0.95" />
    <path d="M 0 -22 C 8 -22 18 -14 18 -4 C 18 6 8 14 0 20 C -8 14 -18 6 -18 -4 C -18 -14 -8 -22 0 -22 Z" fill="url(#petalGrad)" opacity="0.85" transform="rotate(45)" />
    <path d="M 0 -22 C 8 -22 18 -14 18 -4 C 18 6 8 14 0 20 C -8 14 -18 6 -18 -4 C -18 -14 -8 -22 0 -22 Z" fill="url(#petalGrad)" opacity="0.95" transform="rotate(90)" />
    <path d="M 0 -22 C 8 -22 18 -14 18 -4 C 18 6 8 14 0 20 C -8 14 -18 6 -18 -4 C -18 -14 -8 -22 0 -22 Z" fill="url(#petalGrad)" opacity="0.85" transform="rotate(135)" />
    <!-- Center core -->
    <circle cx="0" cy="0" r="5" fill="#4A261B" />
  </g>
  
  <!-- Brand wordmark -->
  <text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FDF8F3" text-anchor="middle">BLISSCLUB</text>
</svg>
